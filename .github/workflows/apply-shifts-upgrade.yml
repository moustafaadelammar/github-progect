name: Apply HR roster upgrade

on:
  push:
    branches: [main]
    paths:
      - 'admin-affairs/scripts/apply-shifts-upgrade.mjs'
      - 'admin-affairs/src/Shifts.tsx'
      - '.github/workflows/apply-shifts-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-affairs/package-lock.json

      - name: Install dependencies
        working-directory: admin-affairs
        run: npm ci

      - name: Apply source patch
        working-directory: admin-affairs
        run: node scripts/apply-shifts-upgrade.mjs

      - name: Build verification
        working-directory: admin-affairs
        run: npm run build

      - name: Commit patched App.tsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-affairs/src/App.tsx
          if git diff --cached --quiet; then
            echo "No App.tsx changes needed."
          else
            git commit -m "Integrate weekly rosters with attendance and reports"
            git push
          fi
