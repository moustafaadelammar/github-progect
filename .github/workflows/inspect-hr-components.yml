name: inspect-hr-components
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          echo '--- components ---'
          grep -nE '^function (App|Dashboard|Attendance|Reports|FingerprintDevices|Shifts)' admin-affairs/src/App.tsx || true
          echo '--- key storage ---'
          grep -nE "hr_(punches|leaves|settings|devices)|localStorage.setItem" admin-affairs/src/App.tsx | head -80 || true
          echo '--- app routing ---'
          grep -nE "active===|section==='|<FingerprintDevices|<Shifts" admin-affairs/src/App.tsx | tail -80 || true
          echo '--- shifts ---'
          grep -nE '^type Week|function Shifts|groups:|الثالثة|راحة' admin-affairs/src/Shifts.tsx | head -80 || true
