name: Diagnose App syntax
on:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect App.tsx around reported offset
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('admin-affairs/src/App.tsx','utf8');
          const p=70032;
          console.log('length=',s.length);
          console.log('context=',JSON.stringify(s.slice(Math.max(0,p-500),p+500)));
          console.log('chars=',Array.from(s.slice(Math.max(0,p-30),p+30)).map((c,i)=>({i:p-30+i,c,code:c.codePointAt(0)})));
          NODE
      - name: Build
        working-directory: admin-affairs
        run: npm ci && npm run build
