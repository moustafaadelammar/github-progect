name: Verify HR changes
on:
  workflow_dispatch: # rerun2
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd admin-affairs && npm install && npm run build
