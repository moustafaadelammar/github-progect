          replacement=`function unwrapSdk(result){return Array.isArray(result)?result:(result?.data||result?.users||result?.logs||result?.records||[])}
function sdkUser(raw){return {pin:clean(raw?.userid??raw?.userId??raw?.user_id??raw?.pin??raw?.id),uid:String(raw?.uid??raw?.userSn??''),name:clean(raw?.name??raw?.userName??raw?.username),card:String(raw?.cardno??raw?.cardNo??raw?.card??'0'),userId:clean(raw?.userid??raw?.userId??raw?.user_id??raw?.pin??raw?.id)}}
function sdkLog(raw){const code=clean(raw?.userid??raw?.userId??raw?.user_id??raw?.pin??raw?.deviceUserId??raw?.device_user_id);const rawDate=raw?.recordTime??raw?.record_time??raw?.attTime??raw?.timestamp??raw?.time??raw?.datetime;const d=rawDate instanceof Date?rawDate:new Date(rawDate);return code&&!Number.isNaN(d.getTime())?{userId:code,timestamp:d}:null}
async function getZkData(d){const device=await openZk(d);try{const users=unwrapSdk(await device.getUsers()).map(sdkUser).filter(x=>x.pin||x.name);const logs=unwrapSdk(await device.getAttendances()).map(sdkLog).filter(Boolean);return {device,users,logs}}catch(e){try{await device.disconnect()}catch{};throw e}}
async function pullZkUsers(d){const {device,users}=await getZkData(d);try{return users}finally{try{await device.disconnect()}catch{}}}
async function pullZk(d){const {device,users,logs}=await getZkData(d);try{const byKey=new Map();for(const u of users){if(u.pin)byKey.set(clean(u.pin),u);if(u.uid)byKey.set(clean(u.uid),u)}return logs.map(x=>{const user=byKey.get(clean(x.userId)),code=clean(user?.pin)||clean(x.userId);if(!code)return null;const dt=x.timestamp;return {id:Date.now()+Math.floor(Math.random()*100000),code,name:clean(user?.name),date:dt.toISOString().slice(0,10),time:dt.toTimeString().slice(0,5)}}).filter(Boolean)}finally{try{await device.disconnect()}catch{}}}
async function testZk`
