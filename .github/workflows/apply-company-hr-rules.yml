          quick=`function FingerprintQuickSync({punches,setPunches,devices,setDevices}:{punches:Punch[];setPunches:Dispatch<SetStateAction<Punch[]>>;devices:FingerprintDevice[];setDevices:Dispatch<SetStateAction<FingerprintDevice[]>>}){const [busy,setBusy]=useState(false),[message,setMessage]=useState('');async function run(){setBusy(true);setMessage('جاري اكتشاف جهاز البصمة على TCP 4370 ثم سحب السجلات...');try{const r=await fetch('/api/fingerprint/discover?port=4370'),j=await r.json(),found=(j.devices||[]).filter((x:any)=>Number(x.port)===4370);if(!found.length)throw new Error('لم يتم العثور على جهاز بصمة على البورت 4370 داخل الشبكة المحلية.');const d=found[0],device:FingerprintDevice={id:uid(),name:d.name||'جهاز البصمة',ip:d.ip,port:4370,protocol:'zk',status:'مكتشف',lastSync:'',notes:'تم الاكتشاف من الرئيسية'};const tr=await fetch('/api/fingerprint/test?ip='+encodeURIComponent(d.ip)+'&port=4370&protocol=zk'),tj=await tr.json();if(!tr.ok||!tj.ok)throw new Error(tj.message||'فشل الاتصال بجهاز البصمة');const pr=await fetch('/api/fingerprint/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(device)}),pj=await pr.json();if(!pr.ok)throw new Error(pj.message||'فشل سحب سجلات البصمة');const incoming=(pj.punches||[]) as Punch[];setPunches(xs=>{const map=new Map(xs.map(x=>[x.code+'|'+x.date+'|'+x.time,x]));incoming.forEach(x=>map.set(x.code+'|'+x.date+'|'+x.time,x));return [...map.values()]});setDevices(xs=>{const exists=xs.find(x=>x.ip===d.ip&&x.port===4370),item={...(exists||device),status:'متصل',lastSeen:new Date().toLocaleString('ar-EG'),lastSync:new Date().toLocaleString('ar-EG'),lastSyncCount:incoming.length,lastNewCount:incoming.filter(x=>!punches.some(p=>p.code===x.code&&p.date===x.date&&p.time===x.time)).length};return exists?xs.map(x=>x.id===exists.id?item:x):[...xs,item]});setMessage('تم الاتصال وسحب '+incoming.length+' سجل بصمة. الجديد يضاف بدون تكرار.')}catch(e){setMessage(e instanceof Error?e.message:'تعذر الاتصال بجهاز البصمة.')}finally{setBusy(false)}}return <section className="panel"><div className="panel-header"><div><h2>بوابة البصمة السريعة</h2><p>زر واحد: اكتشاف الجهاز على TCP 4370 → اتصال مباشر → سحب الحضور والانصراف.</p></div><button className="primary-btn" disabled={busy} onClick={run}>{busy?'⏳ جاري الاتصال...':'🖐️ اكتشاف وسحب البصمة'}</button></div>{message&&<div className="notice">{message}</div>}</section>}`
