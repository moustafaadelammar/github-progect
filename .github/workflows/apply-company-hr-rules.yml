>w.start===activeWeek)?.groups[i]||[])}}>{x} ({currentWeeks.find(w=>w.start===activeWeek)?.groups[i]?.length||0})</button>)}</div><div className="toolbar"><input placeholder="بحث بالاسم أو الرقم أو الوظيفة" value={search} onChange={e=>setSearch(e.target.value)}/><button className="primary-btn" disabled={!activeWeek} onClick={saveGroup}>💾 حفظ المجموعة</button></div><TableWrap><table><thead><tr><th>اختيار</th><th>الرقم</th><th>الاسم</th><th>الوظيفة</th><th>القسم</th></tr></thead><tbody>{filtered.map(e=><tr key={e.id}><td><input type="checkbox" checked={group.includes(e.code)} disabled={!activeWeek} onChange={()=>setGroup(g=>g.includes(e.code)?g.filter(x=>x!==e.code):[...g,e.code])}/></td><td>{e.code}</td><td>{e.name}</td><td>{e.job||'—'}</td><td>{e.department}</td></tr>)}</tbody></table></TableWrap></section><section className="panel table-panel"><h3>الأسابيع المسجلة</h3><TableWrap><table><thead><tr><th>الأسبوع</th>{labels.map(x=><th key={x}>{x}</th>)}<th>إجراء</th></tr></thead><tbody>{currentWeeks.map(w=><tr key={w.id}><td>{weekLabel(w.start)}</td>{labels.map((_,i)=><td key={i}>{w.groups[i]?.length?w.groups[i].map(code=>employees.find(e=>e.code===code)?.name||code).join('، '):'—'}</td>)}<td><button className="view-btn" onClick={()=>{setActiveWeek(w.start);setSelectedGroup(0);setGroup(w.groups[0]||[])}}>تعديل</button></td></tr>)}</tbody></table></TableWrap></section><section className="panel table-panel"><h3>بيان الشهر</h3><div className="toolbar"><input type="month" value={previewMonth} onChange={e=>setPreviewMonth(e.target.value)}/><button className="primary-btn" onClick={()=>preview(statement())}>👁 معاينة ثم طباعة</button></div><TableWrap><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الرقم</th><th>الموظف</th><th>الوظيفة</th><th>المقر</th><th>الوردية</th></tr></thead><tbody>{statement().slice(0,200).map((r,i)=><tr key={i}><td>{r.التاريخ}</td><td>{r.اليوم}</td><td>{r.الرقم}</td><td>{r.الاسم}</td><td>{r.الوظيفة||'—'}</td><td>{r.المقر}</td><td>{r.الوردية}</td></tr>)}{!statement().length&&<EmptyRow col={7} text="أنشئ الأسبوع الأول وحدد الموظفين ثم ابنِ الشهر."/>}</tbody></table></TableWrap></section></>}</>}
