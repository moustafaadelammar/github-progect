name: One-time HR build check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd admin-affairs && npm install && npm run build
      - name: remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-hr-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-hr-build.yml
          git commit -m "chore: remove one-time build check" || true
          git push
